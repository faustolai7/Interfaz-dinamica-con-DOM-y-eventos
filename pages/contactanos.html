    <main class="maincontact">
        <div class="container">
            <h1 class="h2contact">Contactanos</h1>
            <form>
                <fieldset>
                    <legend>Datos del usuario</legend>
                    <div class="mb-3">
                        <label for="form-name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="form-name" placeholder="Escriba su nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="from-apl" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="from-apl" placeholder="Escriba su apellido" required>
                    </div>
                    <div class="mb-3">
                        <label for="from-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="from-email" placeholder="Escriba su correo electronico" required>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Consulta o quejas</legend>
                    <textarea class="form-control" placeholder="Escriba su cunsulta o queja"></textarea>
                </fieldset>
                <input type="submit" class="btn btn-neon mt-3" value="Enviar">
            </form>
            <section>
                <iframe title="Ubicación de Timbó Hardware en el mapa"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d252.16067580365151!2d-60.49565575355877!3d-31.752585720716606!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95b44ddc25645367%3A0x3a092cbb2040b0ad!2zRWwgVGltYsOzLCBFMzEwMiBQYXJhbsOhLCBFbnRyZSBSw61vcw!5e0!3m2!1ses!2sar!4v1782133931710!5m2!1ses!2sar"
